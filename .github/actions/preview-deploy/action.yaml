name: Preview Deploy Targets
description: 指定されたターゲットに対してプレビューデプロイを実行します

inputs:
  filter:
    description:  デプロイ対象を絞り込むフィルタオプションのJSON配列．[]は明示的に空を指定します．
    required: false
  picked:
    description: 手動指定した正確なパッケージ名のJSON配列
    required: false
  head_sha:
    description: 準備したPRのhead SHA
    required: true
  base_sha:
    description: 差分選定に使用したbase SHA（manual pickでは未指定）
    required: false
  pr_number:
    description: プレビューデプロイ対象のプルリクエスト番号
    required: true

outputs:
  results:
    description: デプロイ対象ごとの結果JSON
    value: ${{ steps.notify.outputs.results }}
  body:
    description: PRコメントとサマリーに書き込んだ本文
    value: ${{ steps.notify.outputs.body }}

runs:
  using: "composite"
  steps: 
    - name: deploy対象の絞り込み
      id: filter
      uses: ./.github/actions/filter-util
      with:
        task: deploy
        filter: ${{ inputs.picked || inputs.filter }}
        dependents: ${{ inputs.picked != '' }}
    
    - name: preview targetsの解決
      id: targets
      shell: bash
      env:
        PACKAGES: ${{ steps.filter.outputs.input_packages }}
        PICKED: ${{ inputs.picked || '[]' }}
      run: node "${{ github.action_path }}/plan.mjs"

    - name: deploy対象の絞り込み
      id: deploy_filter
      uses: ./.github/actions/filter-util
      with:
        task: deploy
        filter: ${{ steps.targets.outputs.packages }}

    - name: デプロイアーティファクトのビルド
      id: build
      if: ${{ steps.deploy_filter.outputs.has_hit == 'true' }}
      shell: bash
      env:
        FILTER: ${{ steps.deploy_filter.outputs.deps_args }}
        TARGETS: ${{ steps.targets.outputs.targets }}
        DEPLOY_CHANNEL: preview
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        mapfile -t args < <(node -e 'JSON.parse(process.env.FILTER).forEach(arg => console.log(arg))')
        pnpm install --frozen-lockfile --prefer-offline "${args[@]}"
        pnpm sync "${args[@]}"
        pnpm exec turbo run build "${args[@]}"

    - name: デプロイ直前のPR有効性確認
      id: check_pr
      if: ${{ steps.deploy_filter.outputs.has_hit == 'true' }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      uses: actions/github-script@v7
      with:
        script: |
          const number = Number(process.env.PR_NUMBER);
          if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
          const { isValidPreview } = await import(`${process.env.ACTION_PATH}/pr.mjs`);
          const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
          const valid = isValidPreview(pr, {
            repository: process.env.GITHUB_REPOSITORY,
            headSha: process.env.HEAD_SHA,
            baseSha: process.env.BASE_SHA,
          });
          core.setOutput('valid', String(valid));
          if (!valid) core.info('PR request is no longer valid; deployment is a no-op.');

    - name: デプロイの実行
      id: deploy
      if: ${{ steps.deploy_filter.outputs.has_hit == 'true' && steps.check_pr.outputs.valid == 'true' }}
      shell: bash
      env:
        FILTER: ${{ steps.deploy_filter.outputs.direct_args }}
      run: |
        mapfile -t args < <(node -e 'JSON.parse(process.env.FILTER).forEach(arg => console.log(arg))')
        set +e
        pnpm exec turbo run deploy --only --continue=always --summarize --ui=stream "${args[@]}" 2>&1 | tee deploy.log
        status=${PIPESTATUS[0]}
        summary_path=$(sed -n 's/^Summary:[[:space:]]*//p' deploy.log | tail -n1)
        if [ -z "$summary_path" ] || [ ! -f "$summary_path" ]; then
          echo "[preview-deploy] Turbo summary missing; per-package results are unavailable (status=$status)." >&2
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
        echo "log_path=$PWD/deploy.log" >> "$GITHUB_OUTPUT"
        exit 0

    - name: デプロイ結果の通知
      id: notify
      if: ${{ always() }}
      uses: actions/github-script@v7
      env:
        TARGETS: ${{ steps.targets.outputs.targets || '[]' }}
        DEPLOY_PACKAGES: ${{ steps.deploy_filter.outputs.packages || '[]' }}
        DEPLOY_STATUS: ${{ steps.deploy.outputs.status || '' }}
        DEPLOY_SUMMARY_PATH: ${{ steps.deploy.outputs.summary_path || '' }}
        DEPLOY_LOG_PATH: ${{ steps.deploy.outputs.log_path || '' }}
        JOB_STATUS: ${{ job.status }}
        STEPS: ${{ toJSON(steps) }}
        PR_NUMBER: ${{ inputs.pr_number }}
        DEPLOY_CHANNEL: preview
        PR_VALID: ${{ steps.check_pr.outputs.valid || '' }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const path = require('node:path');
          const helperPath = path.join(process.env.ACTION_PATH, 'comment.mjs');
          const { buildPreviewDeployReport, notifyPreviewDeployReport } = await import(`file://${helperPath}`);
          const report = buildPreviewDeployReport({
            targetsText: process.env.TARGETS,
            deployPackagesText: process.env.DEPLOY_PACKAGES,
            deployStatusText: process.env.DEPLOY_STATUS,
            summaryPath: process.env.DEPLOY_SUMMARY_PATH,
            logPath: process.env.DEPLOY_LOG_PATH,
            stepsText: process.env.STEPS,
            jobStatus: process.env.JOB_STATUS,
            deployChannel: process.env.DEPLOY_CHANNEL,
            prNumber: process.env.PR_NUMBER,
            prValid: process.env.PR_VALID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          });
          core.setOutput('results', JSON.stringify(report.results));
          core.setOutput('body', report.body);
          await notifyPreviewDeployReport({ core, github, context, report });
      
