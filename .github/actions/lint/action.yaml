name: Lint
description: Lintを実行します

inputs:
  context:
    description: テストコンテキスト。同一コンテキストを共有するLint結果はturboによりキャッシュされます。
    required: false
  filter:
    description: テスト対象を絞り込むフィルタオプションのJSON配列．[]は明示的に空を指定します．
    required: false
  pr_number:
    description: |
      PRまたはIssue番号。既定値はトリガーイベントのPRまたはIssue．
      指定された場合は結果をコメントで通知します．
      コメント投稿には pull-requests write または issues write 権限が必要です．
    required: false

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/use-repo
      with:
        context: ${{ inputs.context }}

    - id: filter
      uses: ./.github/actions/filter-util
      with:
        task: lint
        filter: ${{ inputs.filter }}

    - id: lint
      if: ${{ steps.filter.outputs.has_hit == 'true' }}
      shell: bash
      env:
        HUSKY: 0
        LINT_ARGS: ${{ steps.filter.outputs.affected_args }}
        DEPS_ARGS: ${{ steps.filter.outputs.deps_args }}
      run: |
        mapfile -t lint_args < <(node -e 'JSON.parse(process.env.LINT_ARGS).forEach(arg => console.log(arg))')
        mapfile -t install_args < <(node -e 'JSON.parse(process.env.DEPS_ARGS).forEach(arg => console.log(arg))')

        pnpm install --frozen-lockfile --prefer-offline --no-optimistic-repeat-install "${install_args[@]}"
        pnpm install --frozen-lockfile --prefer-offline --no-optimistic-repeat-install "${lint_args[@]}"
        pnpm exec turbo run lint --only "${lint_args[@]}"

    - name: Lint失敗時のコメント投稿
      if: ${{ failure() && steps.lint.outcome == 'failure' && (inputs.pr_number || github.event.pull_request.number || github.event.issue.number) }}
      uses: ./.github/actions/comment-result
      with:
        pr_number: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        marker: lint-failure
        title: Lint Failure
        status: failure
        body: |
          Lint failed during workflow execution. Please check the workflow run logs for detailed failure traces.
