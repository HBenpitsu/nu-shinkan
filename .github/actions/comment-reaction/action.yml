name: コメントリアクション
description: 処理開始時およびジョブ成功/失敗後にリアクションを追加します。
inputs:
  token:
    description: PRコメントのリアクション書き込み権限を持つトークン
    required: true
    default: ${{ github.token }}
  job-status:
    description: アクション実行時に評価されるジョブステータス
    # The runner evaluates this default again when running post.
    default: ${{ job.status }}
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: "!cancelled()"
