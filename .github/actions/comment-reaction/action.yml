name: Comment reaction
description: React when processing starts and after the job succeeds or fails.
inputs:
  token:
    description: Token with permission to write PR comment reactions
    required: true
  job-status:
    description: Job status evaluated when the action runs
    # The runner evaluates this default again when running post.
    default: ${{ job.status }}
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: "!cancelled()"
