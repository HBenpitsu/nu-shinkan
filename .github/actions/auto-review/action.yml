name: 自動レビュー
description: コードの自動チェックを行い、プルリクエストにサマリーレビューを投稿します。

inputs:
  pr_number:
    description: プルリクエスト番号
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        script: |
          const path = require('node:path');
          const scriptPath = path.join(process.env.ACTION_PATH, 'review.mjs');
          const { runAutoReview } = await import(`file://${scriptPath}`);
          await runAutoReview({
            github,
            context,
            core,
            prNumber: process.env.PR_NUMBER
          });
