name: Turboフィルターの絞り込み
description: 特定のタスクに一致するようにTurboフィルターを絞り込み、直接タスクおよび依存タスクの引数を出力します。
inputs:
  task:
    description: 対象のTurboタスク名
    required: true
  filter:
    description: 絞り込み対象のTurboフィルター
    default: ""
outputs:
  packages:
    description: 正確なパッケージ名のJSON配列
  deps_args:
    description: 依存関係引数のJSON配列
  affected_args:
    description: タスク実行用引数のJSON配列
  has_hit:
    description: 一致するタスクが存在するかどうか（"true" または "false"）
runs:
  using: node24
  main: refine-filter.mjs
