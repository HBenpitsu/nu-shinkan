name: Full deploy
description: build and deploy every package to staging or release.
inputs:
  channel:
    description: staging or release
    required: true
    choices:
      - staging
      - release
outputs:
  results:
    description: Package deployment results
    value: ${{ steps.deploy.outputs.results }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/use-repo
    - name: Build all packages
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
      run: |
        pnpm sync
        pnpm exec turbo run build
    - name: Deploy all packages
      id: deploy
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
      run: pnpm exec turbo run deploy
