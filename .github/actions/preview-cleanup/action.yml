name: PR向けプレビューWorkersのクリーンアップ
description: 単一のPRに対応する各パッケージのWorkerを削除します。
inputs:
  pr_number:
    description: 削除対象のPR番号
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
    - shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      run: pnpm exec turbo run undeploy:preview --only --continue=always
