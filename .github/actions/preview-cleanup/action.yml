name: Cleanup preview Workers for PR
description: Cleanup each package's Worker for one PR.
inputs:
  pr_number:
    description: PR number to prune
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
    - name: Cleanup preview Workers
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
      run: pnpm exec turbo run undeploy:preview --only --continue=always
