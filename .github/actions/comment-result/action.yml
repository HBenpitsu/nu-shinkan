name: Comment Result
description: Post or update a result comment on a PR or Issue.

inputs:
  pr_number:
    description: PR or Issue number
    required: true
  marker:
    description: Unique marker tag for comment upserting (e.g. ui_test-report)
    required: false
    default: result-comment
  title:
    description: Comment title
    required: false
  body:
    description: Comment body content
    required: false
  status:
    description: Status string (success, failure, etc.)
    required: false
  artifact_url:
    description: Optional artifact download URL
    required: false

runs:
  using: "composite"
  steps:
    - name: Post or Update Comment
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
        MARKER: ${{ inputs.marker }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        STATUS: ${{ inputs.status }}
        ARTIFACT_URL: ${{ inputs.artifact_url }}
      with:
        script: |
          const path = require('node:path');
          const scriptPath = path.join(process.env.ACTION_PATH, 'comment.mjs');
          const { upsertComment } = await import(`file://${scriptPath}`);
          await upsertComment({
            github,
            context,
            prNumber: process.env.PR_NUMBER,
            marker: process.env.MARKER,
            title: process.env.TITLE,
            body: process.env.BODY,
            status: process.env.STATUS,
            artifactUrl: process.env.ARTIFACT_URL
          });
