name: Authorize PR command author
description: Require an exact PR comment command and effective repository write permission for its author.
inputs:
  command:
    description: Expected slash command without arguments (for example /merge-ff)
    required: true
outputs:
  pr_number:
    description: Pull request receiving the authorized command
    value: ${{ steps.authorize.outputs.pr_number }}
  actor:
    description: Authorized comment author (not the PR author or rerun actor)
    value: ${{ steps.authorize.outputs.actor }}
runs:
  using: composite
  steps:
    - id: authorize
      uses: actions/github-script@v8.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMMAND: ${{ inputs.command }}
      with:
        script: |
          const { commandAuthor, requireWritePermission } = await import(`${process.env.ACTION_PATH}/policy.mjs`);
          const username = commandAuthor(context.eventName, context.payload, process.env.COMMAND);
          const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
            ...context.repo, username,
          });
          requireWritePermission(access.permission);
          core.setOutput('pr_number', context.payload.issue.number);
          core.setOutput('actor', username);
          core.info('PR command author has effective repository write permission.');
