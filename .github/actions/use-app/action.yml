name: GitHub Appによるリポジトリセットアップ
description: GitHub App認証情報を使用してリポジトリをセットアップします。

outputs:
  TOKEN: 
    description: リポジトリ用 GitHub App トークン
    value: ${{ steps.app-token.outputs.token }}
inputs:
  app_id:
    description: GitHub App ID
    required: true
  app_private_key:
    description: GitHub App private key
    required: true
runs:
  using: "composite"
  steps:
    - name: GitHub App認証情報の検証
      shell: bash
      env:
        APP_ID: ${{ inputs.app_id }}
        APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
      run: |
        set -euo pipefail

        if [[ -z "${APP_ID}" ]]; then
          echo "Missing required secret: APP_ID" >&2
          exit 1
        fi

        if [[ -z "${APP_PRIVATE_KEY}" ]]; then
          echo "Missing required secret: APP_PRIVATE_KEY" >&2
          exit 1
        fi

    - id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
