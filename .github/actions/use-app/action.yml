name: Repository Setup with GitHub App
description: Checkout Repository with GitHub App credentials

inputs:
  APP_ID:
    description: GitHub App ID.
    required: true
  APP_PRIVATE_KEY:
    description: GitHub App private key.
    required: true
outputs:
  TOKEN: 
    description: GitHub App token for the repository.
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Validate GitHub App credentials
      shell: bash
      env:
        APP_ID: ${{ inputs.APP_ID }}
        APP_PRIVATE_KEY: ${{ inputs.APP_PRIVATE_KEY }}
      run: |
        set -euo pipefail

        if [[ -z "${APP_ID}" ]]; then
          echo "Missing required secret: APP_ID" >&2
          exit 1
        fi

        if [[ -z "${APP_PRIVATE_KEY}" ]]; then
          echo "Missing required secret: APP_PRIVATE_KEY" >&2
          exit 1
        fi

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.APP_ID }}
        private-key: ${{ inputs.APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
