name: GitHub Appによるリポジトリセットアップ
description: GitHub App認証情報を使用してリポジトリをセットアップします。

inputs:
  APP_ID:
    description: GitHub App ID
    required: true
  APP_PRIVATE_KEY:
    description: GitHub App 秘密鍵
    required: true
outputs:
  TOKEN: 
    description: リポジトリ用 GitHub App トークン
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: GitHub App認証情報の検証
      shell: bash
      env:
        APP_ID: ${{ inputs.APP_ID }}
        APP_PRIVATE_KEY: ${{ inputs.APP_PRIVATE_KEY }}
      run: |
        set -euo pipefail

        if [[ -z "${APP_ID}" ]]; then
          echo "Missing required secret: APP_ID" >&2
          exit 1
        fi

        if [[ -z "${APP_PRIVATE_KEY}" ]]; then
          echo "Missing required secret: APP_PRIVATE_KEY" >&2
          exit 1
        fi

    - id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.APP_ID }}
        private-key: ${{ inputs.APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
