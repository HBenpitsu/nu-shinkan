name: タグリビジョンの解決
description: 対象タグのHeadおよびBaseコミットSHAを解決します。
inputs:
  event_name:
    description: トリガーされたイベント名
    required: true
  channel:
    description: 選択されたチャネル名
    required: true
  before:
    description: 変更前のSHA
    required: false
  after:
    description: 変更後のSHA
    required: false
  created:
    description: タグが新規作成されたかどうか
    required: false
outputs:
  channel:
    description: 検証済みチャネル
  head:
    description: HeadコミットSHA
  base:
    description: BaseコミットSHA
runs:
  using: node24
  main: resolve-tag.mjs
