name: タグリビジョンの解決
description: 対象タグのHeadおよびBaseコミットSHAを解決します。
inputs:
  event_name:
    description: トリガーされたイベント名
    required: true
  channel:
    description: 選択されたチャネル名
    required: true
  before:
    description: 変更前のSHA
    required: false
  after:
    description: 変更後のSHA
    required: false
  created:
    description: タグが新規作成されたかどうか
    required: false
outputs:
  channel:
    description: 検証済みチャネル
    value: ${{ steps.resolve.outputs.channel }}
  head:
    description: HeadコミットSHA
    value: ${{ steps.resolve.outputs.head }}
  base:
    description: BaseコミットSHA
    value: ${{ steps.resolve.outputs.base }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        EVENT: ${{ inputs.event_name }}
        CHANNEL: ${{ inputs.channel }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        CREATED: ${{ inputs.created }}
      run: node "${{ github.action_path }}/resolve-tag.mjs"
