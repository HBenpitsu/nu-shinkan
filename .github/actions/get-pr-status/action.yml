name: PR状態取得
description: プルリクエストの状態およびメタデータを取得します。

inputs:
  token:
    description: PRの読み取り権限を持つトークン
    required: true
    default: ${{ github.token }}
  pr_number:
    description: プルリクエスト番号
    required: true

outputs:
  is_open:
    description: PRが現在オープン中かどうか（"true" または "false"）
  is_same_repo:
    description: PRのHeadリポジトリが同一リポジトリかどうか（"true" または "false"）
  is_mergeable:
    description: PRにマージコンフリクトがないかどうか（"true" または "false"）
  is_draft:
    description: PRがドラフトかどうか（"true" または "false"）
  head_sha:
    description: PRのHeadコミットSHA
  base_sha:
    description: PRのBaseコミットSHA

  title:
    description: PRのタイトル

runs:
  using: node24
  main: check-status.mjs
