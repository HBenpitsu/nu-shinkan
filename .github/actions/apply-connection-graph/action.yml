name: 接続グラフの適用
description: ソースパッケージ名からレビューパスを選択します。
inputs:
  sources:
    description: ソースパッケージ名のJSON配列
    required: true
outputs:
  deploy_targets:
    description: 選択されたパッケージ名のJSON
    value: ${{ steps.select.outputs.deploy_targets }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
    - id: select
      shell: bash
      env:
        SOURCES: ${{ inputs.sources }}
      run: node "${{ github.action_path }}/select.mjs"
