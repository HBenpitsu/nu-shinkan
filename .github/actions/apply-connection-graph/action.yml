name: Apply Connection Graph
description: Select review paths from source package names.
inputs:
  sources:
    description: JSON array of source package names
    required: true
outputs:
  deploy_targets:
    description: Selected package names as JSON
    value: ${{ steps.select.outputs.deploy_targets }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
      with:
        filter: |
          .
          @repo/scripts...
    - name: Select review targets
      id: select
      shell: bash
      env:
        SOURCES: ${{ inputs.sources }}
      run: |
        node --input-type=module <<'JS'
        import { execFileSync } from 'node:child_process';
        import { appendFileSync } from 'node:fs';
        const sources = JSON.parse(process.env.SOURCES);
        if (!Array.isArray(sources) || sources.some(s => typeof s !== 'string' || !s)) throw Error('Invalid sources');
        const graph = execFileSync('pnpm', ['exec', 'tsx', 'scripts/connection-graph/build.ts'], {encoding:'utf8'});
        const targets = JSON.parse(execFileSync('pnpm', ['exec', 'tsx', 'scripts/connection-graph/select.ts', '--graph', '-', '--', ...sources], {input:graph, encoding:'utf8'}));
        appendFileSync(process.env.GITHUB_OUTPUT, `deploy_targets=${JSON.stringify(targets)}\n`);
        JS
