name: Plan, prepare and deploy
description: Execute all deployment phases in the fixed checkout on one runner.
inputs:
  channel:
    description: staging, release or preview
    required: true
  head_sha:
    description: Fixed target commit
    required: true
  base_sha:
    description: Fixed comparison commit
    default: ""
  selection_source:
    description: diff, full or manual-pick
    required: true
  pr_number:
    description: Preview PR or -1
    default: "-1"
  picks:
    description: JSON array of exact package names
    default: "[]"
outputs:
  changes:
    description: Test packages
    value: ${{ steps.plan.outputs.changes }}
  targets:
    description: Deployment candidates
    value: ${{ steps.plan.outputs.targets }}
runs:
  using: composite
  steps:
    - name: Record request before dependency installation
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: node .github/scripts/deploy/record.mjs setup
    - uses: ./.github/actions/setup
      with:
        cache_channel: ${{ inputs.channel }}
        turbo_cache: update
    - name: Compile configuration package
      shell: bash
      run: |
        node .github/scripts/deploy/record.mjs compile
        pnpm --filter @repo/app-config build
    - name: Select packages
      id: plan
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        HEAD_SHA: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        SELECTION_SOURCE: ${{ inputs.selection_source }}
        PICKS: ${{ inputs.picks }}
      run: pnpm exec tsx .github/scripts/deploy/cli.ts plan
    - name: Sync local configuration
      shell: bash
      run: |
        node .github/scripts/deploy/record.mjs sync
        pnpm sync
    - name: Test and build
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGETS: ${{ steps.plan.outputs.targets }}
      run: pnpm exec tsx .github/scripts/deploy/cli.ts prepare
    - name: Deploy or clean closed preview
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGETS: ${{ steps.plan.outputs.targets }}
        SELECTION_SOURCE: ${{ inputs.selection_source }}
      run: pnpm exec tsx .github/scripts/deploy/cli.ts deploy
    - name: Record final phase outcome
      if: ${{ always() }}
      shell: bash
      env:
        ACTION_STATUS: ${{ job.status }}
      run: node .github/scripts/deploy/record.mjs
