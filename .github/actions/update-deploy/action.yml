name: Update deploy
description: Select, test, build and deploy the update flow in a fixed checkout.
inputs:
  channel:
    description: Deployment channel
    default: "staging"
  head_sha:
    description: Fixed target SHA
    required: true
  base_sha:
    description: Comparison SHA
    default: ""
  pr_number:
    description: Preview PR number
    default: "-1"
  picks:
    description: Exact package names as JSON
    default: "[]"
outputs:
  changes:
    description: Test packages
    value: ${{ steps.plan.outputs.changes }}
  results:
    description: Deployment results
    value: ${{ steps.deploy.outputs.results }}
runs:
  using: composite
  steps:
    - name: Install dependencies
      uses: ./.github/actions/use-repo
    - name: Compile configuration tools
      shell: bash
      run: pnpm --filter @repo/app-config build
    - name: Select packages
      id: plan
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
        PICKS: ${{ inputs.picks }}
      run: pnpm exec tsx .github/actions/update-deploy/plan.mjs
    - name: Sync local configuration
      shell: bash
      run: pnpm sync
    - name: Test changed packages
      shell: bash
      env:
        PACKAGES: ${{ steps.plan.outputs.changes }}
      run: node .github/scripts/task.mjs test
    - name: Build deployment targets
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGETS: ${{ steps.plan.outputs.targets }}
      run: |
        export PACKAGES=$(node -e 'console.log(JSON.stringify(JSON.parse(process.env.TARGETS).map(p => p.package)))')
        node .github/scripts/task.mjs build
    - name: Deploy prepared targets
      id: deploy
      shell: bash
      env:
        DEPLOY_CHANNEL: ${{ inputs.channel }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGETS: ${{ steps.plan.outputs.targets }}
      run: pnpm exec tsx .github/scripts/deploy.mjs
