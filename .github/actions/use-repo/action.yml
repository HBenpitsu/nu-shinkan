name: Repository Setup
description: This action defines setting up steps for workflows to use package dependencies.

inputs:
  context:
    description: Cache key for the Turbo cache. Defaults to the commit hash of the triggering event.
    required: false
  filter:
    description: Turbo filter expressions for install
    required: false

runs:
  using: "composite"
  steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            !node_modules/.cache/turbo
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Print Cache Status
        shell: bash
        run: |
          echo "setup-node cache-hit: ${{ steps.setup-node.outputs.cache-hit }}"
          echo "node_modules cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}"

      - name: Interpret Context
        id: context
        shell: bash
        env:
          SHA: ${{ github.sha }}
          CONTEXT: ${{ inputs.context }}
        run: |
          # if input.context is empty - the key is commit hash
          if [ -z "$CONTEXT" ]; then
            CONTEXT="$SHA"
          fi
          # otherwise, uses the provided context
          echo "CONTEXT=$CONTEXT" >> $GITHUB_ENV
          
      - name: Prepare Turbo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ env.CONTEXT }}

      - name: Install dependencies
        shell: bash
        env:
          HUSKY: 0
          FILTER: ${{ inputs.filter }}
        run: |
          args=()
          while IFS= read -r filter || [ -n "$filter" ]; do
            [ -z "$filter" ] && continue
            args+=("--filter=$filter")
          done <<< "$FILTER"

          pnpm install --frozen-lockfile --prefer-offline "${args[@]}"

