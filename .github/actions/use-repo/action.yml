name: リポジトリセットアップ
description: ワークフローでパッケージ依存関係を使用するためのセットアップ手順を定義します。

inputs:
  context:
    description: Turboキャッシュ用のキャッシュキー。既定値はトリガーイベントのコミットハッシュ。
    required: false

runs:
  using: "composite"
  steps:
    - if: env.REPO_SETUP_DONE != 'true'
      uses: pnpm/action-setup@v4

    - if: env.REPO_SETUP_DONE != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - if: env.REPO_SETUP_DONE != 'true'
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
          !node_modules/.cache/turbo
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

    - name: コンテキストの解釈
      if: env.REPO_SETUP_DONE != 'true'
      shell: bash
      env:
        SHA: ${{ github.sha }}
        CONTEXT: ${{ inputs.context }}
      run: |
        # if input.context is empty - the key is commit hash
        if [ -z "$CONTEXT" ]; then
          CONTEXT="$SHA"
        fi
        # otherwise, uses the provided context
        echo "CONTEXT=$CONTEXT" >> $GITHUB_ENV

    - name: Turboキャッシュの準備
      if: env.REPO_SETUP_DONE != 'true'
      uses: actions/cache@v4
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ env.CONTEXT }}

    - name: デフォルトリポジトリ依存関係のインストール
      shell: bash
      env:
        HUSKY: 0
      run: |
        pnpm install --frozen-lockfile --prefer-offline --filter=. --filter=@repo/scripts...

    - name: セットアップ完了フラグの設定
      if: env.REPO_SETUP_DONE != 'true'
      shell: bash
      run: echo "REPO_SETUP_DONE=true" >> "$GITHUB_ENV"