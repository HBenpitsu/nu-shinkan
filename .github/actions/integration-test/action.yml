name: 統合テスト
description: 指定されたプロファイルとフィルターを使用して統合テストを実行します。
inputs:
  profile:
    description: 統合テストプロファイル（例 local, staging）
    required: false
    default: local
  filter:
    description: Turboフィルターパターン
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
    - shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        FILTER: ${{ inputs.filter }}
        TEST: INTEGRATION
      run: node "${{ github.action_path }}/run-integration.mjs"
