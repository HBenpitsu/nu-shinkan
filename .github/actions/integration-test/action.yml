name: Integration Test Action
description: Runs integration tests using the specified profile and filter.
inputs:
  profile:
    description: Integration test profile (e.g. local, staging)
    required: false
    default: local
  filter:
    description: Turbo filter pattern
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/use-repo
    - name: Run Integration Tests
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        FILTER: ${{ inputs.filter }}
        TEST: INTEGRATION
      run: node "${{ github.action_path }}/run-integration.mjs"
