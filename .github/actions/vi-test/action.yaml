name: テスト (Vitest)
description: プロジェクト単位のテストを実行します。

inputs:
  context:
    description: テストコンテキスト。同一コンテキストを共有するテスト結果は turbo によってキャッシュされます。
    required: false
  filter:
    description: テスト対象を絞り込むフィルタオプションのJSON配列．[]は明示的に空を指定します．
    required: false
  pr_number:
    description: |
      PRまたはIssue番号。既定値はトリガーイベントのPRまたはIssue．
      指定された場合は結果をコメントで通知します．
      コメント投稿には pull-requests write または issues write 権限が必要です．
    required: false

runs:
  using: "composite"
  steps:
    - id: filter
      uses: ./.github/actions/filter-util
      with:
        task: test
        filter: ${{ inputs.filter }}

    - id: tests
      if: ${{ steps.filter.outputs.has_hit == 'true' }}
      shell: bash
      env:
        HUSKY: 0
        TEST: PACKAGE
        DEPS_ARGS: ${{ steps.filter.outputs.deps_args }}
        TEST_ARGS: ${{ steps.filter.outputs.direct_args }}
      run: |
        mapfile -t install_args < <(node -e 'JSON.parse(process.env.DEPS_ARGS).forEach(arg => console.log(arg))')
        mapfile -t test_args < <(node -e 'JSON.parse(process.env.TEST_ARGS).forEach(arg => console.log(arg))')

        pnpm install --frozen-lockfile --prefer-offline "${install_args[@]}"
        pnpm exec turbo run test --only "${test_args[@]}" -- --run

    - name: テスト失敗時のコメント投稿
      if: ${{ failure() && steps.tests.outcome == 'failure' && (inputs.pr_number || github.event.pull_request.number || github.event.issue.number) }}
      uses: ./.github/actions/comment-result
      with:
        pr_number: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        marker: vi_test-failure
        title: Vitest Unit Test Failure
        status: failure
        body: |
          Vitest unit tests failed during workflow execution. Please check the workflow run logs for detailed failure traces.
