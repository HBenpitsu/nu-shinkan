name: Workerターゲットの解決
description: configs-cli を使用してWorkerパッケージのメタデータターゲットを解決します。
inputs:
  packages:
    description: パッケージ名のJSON配列
    required: true
outputs:
  targets:
    description: JSON形式のWorkerターゲットメタデータ
    value: ${{ steps.resolve.outputs.targets }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: node "${{ github.action_path }}/resolve-targets.mjs"
