name: Check PR Status
description: Retrieve and verify state and metadata of a pull request.

inputs:
  pr_number:
    description: Pull request number
    required: true

outputs:
  is_open:
    description: Whether the PR is currently open ("true" or "false")
    value: ${{ steps.check.outputs.is_open }}
  is_same_repo:
    description: Whether the PR head repository is the same repository ("true" or "false")
    value: ${{ steps.check.outputs.is_same_repo }}
  is_mergeable:
    description: Whether the PR has no merge conflicts ("true" or "false")
    value: ${{ steps.check.outputs.is_mergeable }}
  is_draft:
    description: Whether the PR is a draft ("true" or "false")
    value: ${{ steps.check.outputs.is_draft }}
  head_sha:
    description: Head SHA of the PR
    value: ${{ steps.check.outputs.head_sha }}
  base_sha:
    description: Base SHA of the PR
    value: ${{ steps.check.outputs.base_sha }}

runs:
  using: "composite"
  steps:
    - name: Check PR Status
      id: check
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        script: |
          const path = require('node:path');
          const scriptPath = path.join(process.env.ACTION_PATH, 'check-status.mjs');
          const { checkPrStatus } = await import(`file://${scriptPath}`);
          await checkPrStatus({
            github,
            context,
            core,
            prNumber: process.env.PR_NUMBER
          });
