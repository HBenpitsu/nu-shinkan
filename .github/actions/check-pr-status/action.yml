name: PR状態の確認
description: プルリクエストの状態およびメタデータを取得・検証します。

inputs:
  pr_number:
    description: プルリクエスト番号
    required: true

outputs:
  is_open:
    description: PRが現在オープン中かどうか（"true" または "false"）
    value: ${{ steps.check.outputs.is_open }}
  is_same_repo:
    description: PRのHeadリポジトリが同一リポジトリかどうか（"true" または "false"）
    value: ${{ steps.check.outputs.is_same_repo }}
  is_mergeable:
    description: PRにマージコンフリクトがないかどうか（"true" または "false"）
    value: ${{ steps.check.outputs.is_mergeable }}
  is_draft:
    description: PRがドラフトかどうか（"true" または "false"）
    value: ${{ steps.check.outputs.is_draft }}
  head_sha:
    description: PRのHeadコミットSHA
    value: ${{ steps.check.outputs.head_sha }}
  base_sha:
    description: PRのBaseコミットSHA
    value: ${{ steps.check.outputs.base_sha }}

runs:
  using: "composite"
  steps:
    - id: check
      uses: actions/github-script@v7
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        script: |
          const path = require('node:path');
          const scriptPath = path.join(process.env.ACTION_PATH, 'check-status.mjs');
          const { checkPrStatus } = await import(`file://${scriptPath}`);
          await checkPrStatus({
            github,
            context,
            core,
            prNumber: process.env.PR_NUMBER
          });
