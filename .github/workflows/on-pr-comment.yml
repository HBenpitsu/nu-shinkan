name: On Comment to Pull Request
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  receive:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fix PR head and dispatch internal request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/actions/pick-deploy/receive.mjs
