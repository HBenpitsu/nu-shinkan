name: プレビューコマンド
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  receive:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview') }}
    runs-on: ubuntu-latest
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
    steps:
      - name: コメント権限検証とPRリビジョン取得
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            if (!/^\/preview(?:\s|$)/.test(context.payload.comment.body)) return;
            for (const username of new Set([context.payload.comment.user.login, process.env.GITHUB_TRIGGERING_ACTOR])) {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username});
              if (!['admin','maintain','write'].includes(data.permission) && !data.user?.permissions?.push)
                throw Error('Preview requires repository write permission');
            }
            const {data:pr} = await github.rest.pulls.get({...context.repo, pull_number:context.payload.issue.number});
            if (pr.state !== 'open' || pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
              core.info('Preview requires an open PR from this repository');
              return;
            }
            core.setOutput('accepted','true');
            core.setOutput('head_sha',pr.head.sha);
            core.setOutput('base_sha',pr.base.sha);
            core.setOutput('pr_number',pr.number);
  preview:
    needs: receive
    if: ${{ needs.receive.outputs.accepted == 'true' }}
    uses: ./.github/workflows/review.pick-deploy.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.receive.outputs.head_sha }}
      base_sha: ${{ needs.receive.outputs.base_sha }}
      pr_number: ${{ fromJSON(needs.receive.outputs.pr_number) }}
