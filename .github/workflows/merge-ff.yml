name: Merge Fast-Forward

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    name: Merge Fast-Forward
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/merge-ff')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Put reaction early
      - name: Track comment reaction
        uses: ./.github/actions/comment-reaction
        with:
          token: ${{ github.token }}

      # The main flow begins here
      - name: Use GitHub App
        uses: ./.github/actions/use-app
        with:
          APP_ID: ${{ secrets.PR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PR_APP_PRIVATE_KEY }}

      - name: Resolve pull request metadata
        id: pr-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pr.base.ref);

      - name: Merge Fast-Forward
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ steps.pr-metadata.outputs.base_ref }}
        run: |
          original_sha=$(git rev-parse HEAD)
          trap 'git switch --detach "$original_sha"' EXIT
          
          set -euo pipefail

          git fetch origin
          git fetch origin "${BASE_REF}"
          git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head"
          git checkout -B "${BASE_REF}" "origin/${BASE_REF}"
          git merge --ff-only "pr-${PR_NUMBER}-head"
          git push origin "${BASE_REF}"
