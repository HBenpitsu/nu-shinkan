name: ファストフォワードマージ

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/merge-ff')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ワークフローアクションのチェックアウト
        uses: actions/checkout@v6.1.0
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Put reaction early
      - uses: ./.github/actions/comment-reaction

      # The main flow begins here
      - id: use-app
        uses: ./.github/actions/use-app
        with:
          app_id: ${{ secrets.GIT_OPS_APP_ID }}
          app_private_key: ${{ secrets.GIT_OPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6.1.0
        with:
          token: ${{ steps.use-app.outputs.TOKEN }}

      - name: PRメタデータの解決
        id: pr-metadata
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pr.base.ref);

      - name: ファストフォワードマージの実行
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ steps.pr-metadata.outputs.base_ref }}
        run: |
          original_sha=$(git rev-parse HEAD)
          trap 'git switch --detach "$original_sha"' EXIT

          set -euo pipefail

          git fetch origin
          git fetch origin "${BASE_REF}"
          git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head"
          git checkout -B "${BASE_REF}" "origin/${BASE_REF}"
          git merge --ff-only "pr-${PR_NUMBER}-head"
          git push origin "${BASE_REF}"
