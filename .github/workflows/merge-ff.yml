name: ファストフォワードマージ

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/merge-ff')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: ワークフローアクションのチェックアウト
        uses: actions/checkout@v7
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: PRコマンド投稿者の権限検証
        id: command
        uses: ./.github/actions/authorize-pr-command
        with:
          command: /merge-ff

      - name: 通常のPRマージ可否の検証
        id: authorized
        uses: ./.github/actions/check-pr-mergeable
        with:
          pr-number: ${{ steps.command.outputs.pr_number }}

      - uses: ./.github/actions/comment-reaction

      # Mint write credentials only after ordinary merge eligibility is established.
      - id: use-app
        uses: ./.github/actions/use-app
        with:
          client_id: ${{ secrets.GIT_OPS_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.GIT_OPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.use-app.outputs.TOKEN }}
          ref: refs/heads/${{ steps.authorized.outputs.base_ref }}
          fetch-depth: 0

      - name: 検証済みコミットのファストフォワードマージ
        shell: bash
        env:
          HEAD_SHA: ${{ steps.authorized.outputs.head_sha }}
          BASE_REF: ${{ steps.authorized.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          git merge --ff-only "$HEAD_SHA"
          git push origin "HEAD:refs/heads/${BASE_REF}"
