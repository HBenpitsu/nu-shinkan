name: Merge Fast-Forward

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    name: Merge Fast-Forward
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/merge-ff')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Add initial reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Validate GitHub App credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.PR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_ID}" ]]; then
            echo "Missing required secret: APP_ID" >&2
            exit 1
          fi

          if [[ -z "${APP_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: APP_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PR_APP_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve pull request metadata
        id: pr-metadata
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pr.base.ref);

      - name: Merge Fast-Forward
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ steps.pr-metadata.outputs.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin
          git fetch origin "${BASE_REF}"
          git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head"
          git checkout -B "${BASE_REF}" "origin/${BASE_REF}"
          git merge --ff-only "pr-${PR_NUMBER}-head"
          git push origin "${BASE_REF}"
        
      - name: Add success reaction
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'hooray'
            });

      - name: Add failure reaction
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });