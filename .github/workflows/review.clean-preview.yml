name: プレビューWorkersのクリーンアップ
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: プレビューリソースを削除するプルリクエスト番号
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  queue: single
  cancel-in-progress: false
env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
  MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/use-repo

      - name: 現在のPR状態の確認
        id: state
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          MANUAL: ${{ env.MANUAL }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
            const {data:pr} = await github.rest.pulls.get({...context.repo, pull_number:number});
            if (!pr) throw Error('PR not found');
            const { shouldCleanup } = await import(`${process.env.GITHUB_WORKSPACE}/.github/actions/preview-deploy/pr.mjs`);
            const cleanup = shouldCleanup(pr, process.env.MANUAL === 'true');
            core.setOutput('cleanup', String(cleanup));
            if (!cleanup) core.info('PR reopened; cleanup is a no-op.');
          
      - name: PR Workersの削除
        if: ${{ steps.state.outputs.cleanup == 'true' }}
        shell: bash
        env:
          HUSKY: 0
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: | 
          pnpm install --frozen-lockfile --prefer-offline
          pnpm exec turbo run undeploy:preview --continue=always
    
      - name: クリーンアップ失敗時のコメント投稿
        if: ${{ failure() && env.PR_NUMBER }}
        uses: ./.github/actions/comment-result
        with:
          pr_number: ${{ env.PR_NUMBER }}
          marker: cleanup-failure
          title: Cleanup Failure
          status: failure
          body: |
            Cleanup of preview resources failed during workflow execution. Please check the workflow run logs for detailed failure traces.
