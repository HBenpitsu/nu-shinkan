name: プレビューWorkersのクリーンアップ
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: プレビューリソースを削除するプルリクエスト番号
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  queue: single
  cancel-in-progress: false
env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
  MANUAL: ${{ !github.event.pull_request }}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 現在のPR状態の確認
        id: state
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          MANUAL: ${{ env.MANUAL }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
            const {data:pr} = await github.rest.pulls.get({...context.repo, pull_number:number});
            if (!pr) throw Error('PR not found');
            if (pr.state !== 'closed' && process.env.MANUAL !== 'true') {
              throw Error('PR is not closed and this is not a manual run');
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: PR Workersの削除
        shell: bash
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: pnpm exec turbo run undeploy:preview --only --continue=always
    
      - name: クリーンアップ失敗時のコメント投稿
        if: ${{ failure() && env.PR_NUMBER }}
        uses: ./.github/actions/comment-result
        with:
          pr_number: ${{ env.PR_NUMBER }}
          marker: cleanup-failure
          title: Cleanup Failure
          status: failure
          body: |
            Cleanup of preview resources failed during workflow execution. Please check the workflow run logs for detailed failure traces.
