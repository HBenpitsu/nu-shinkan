name: レビュープレビューデプロイ
on:
  workflow_call:
    inputs:
      head_sha:
        description: "固定デプロイSHA"
        type: string
        required: true
      base_sha:
        description: "固定比較SHA"
        type: string
        required: true
      pr_number:
        description: "プルリクエスト番号"
        type: number
        required: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-pr-${{ inputs.pr_number }}
  queue: single
  cancel-in-progress: false
jobs:
  review-deploy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 現在のPR状態の確認
        id: state
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA)) throw Error('Invalid head SHA');
            const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: number});
            const operation = pr.state === 'closed' ? 'cleanup'
              : pr.head.repo?.full_name === process.env.GITHUB_REPOSITORY && pr.head.sha === process.env.HEAD_SHA && pr.base.sha === process.env.BASE_SHA ? 'deploy' : 'skip';
            core.setOutput('operation', operation);
            core.info(`PR #${number}: ${operation}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: チェックアウトの検証
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: クローズ済みPRのクリーンアップ
        if: ${{ steps.state.outputs.operation == 'cleanup' }}
        uses: ./.github/actions/preview-cleanup
        with:
          pr_number: ${{ inputs.pr_number }}
      - if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: ./.github/actions/use-repo
        with:
          filter: |
            .
            @repo/scripts...
      - name: 変更および影響のあるパッケージの選択
        id: selection
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const list = (filters = []) => {
              const value = JSON.parse(execFileSync('pnpm', ['exec', 'turbo', 'ls', '--output=json', ...filters], {encoding:'utf8'}));
              if (!Array.isArray(value?.packages?.items)) throw Error('Invalid Turbo package listing');
              return value.packages.items.map(pkg => pkg.name);
            };

            const { BASE_SHA, HEAD_SHA } = process.env;
            if (![BASE_SHA, HEAD_SHA].every(sha => /^[0-9a-f]{40}$/.test(sha))) throw Error('Invalid comparison SHA');
            const base = execFileSync('git', ['merge-base', BASE_SHA, HEAD_SHA], {encoding:'utf8'}).trim();
            core.setOutput('changes', JSON.stringify(list([`--filter=[${base}...${HEAD_SHA}]`])));
            core.setOutput('affected', JSON.stringify(list([`--filter=...[${base}...${HEAD_SHA}]`])));
      - name: レビューパスの選択
        id: graph
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: actions/github-script@v7
        env:
          SOURCES: ${{ steps.selection.outputs.affected }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sources = JSON.parse(process.env.SOURCES);
            if (!Array.isArray(sources) || sources.some(s => typeof s !== 'string' || !s)) {
              throw new Error('Invalid sources');
            }
            const graph = execFileSync('pnpm', ['exec', 'tsx', 'scripts/connection-graph/build.ts'], { encoding: 'utf8' });
            const targets = JSON.parse(
              execFileSync('pnpm', ['exec', 'tsx', 'scripts/connection-graph/select.ts', '--graph', '-', '--', ...sources], {
                input: graph,
                encoding: 'utf8'
              })
            );
            core.setOutput('deploy_targets', JSON.stringify(targets));
      - name: 実行可能なデプロイタスクの選択
        id: filter
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: ./.github/actions/refine-filter
        with:
          task: deploy
          filter: ${{ steps.graph.outputs.deploy_targets }}
      - name: Workerメタデータの解決
        id: targets
        if: ${{ steps.filter.outputs.has_hit == 'true' }}
        uses: actions/github-script@v7
        env:
          PACKAGES: ${{ steps.filter.outputs.packages }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const names = JSON.parse(process.env.PACKAGES);
            const targets = JSON.parse(
              execFileSync('pnpm', ['exec', 'tsx', 'scripts/workspace/configs-cli.ts', '--targets', '--', ...names], {
                encoding: 'utf8'
              })
            );
            core.setOutput('targets', JSON.stringify(targets));
      - name: 選択されたビルド依存関係のインストール
        if: ${{ steps.filter.outputs.has_hit == 'true' }}
        shell: bash
        env:
          HUSKY: 0
          FILTER: ${{ steps.filter.outputs.deps_args }}
        run: |
          mapfile -t args < <(node -e 'JSON.parse(process.env.FILTER).forEach(arg => console.log(arg))')
          pnpm install --frozen-lockfile --prefer-offline "${args[@]}"
      - name: 単体テスト
        id: unit-tests
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: ./.github/actions/vi-test
        with:
          filter: ${{ steps.selection.outputs.changes }}
          pr_number: ${{ inputs.pr_number }}
      - name: UIテスト
        id: ui-tests
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: ./.github/actions/ui-test
        with:
          filter: ${{ steps.selection.outputs.changes }}
          pr_number: ${{ inputs.pr_number }}
      - name: 変更パッケージのLintフィルタリング
        id: lint
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: ./.github/actions/refine-filter
        with:
          task: lint
          filter: ${{ steps.selection.outputs.changes }}
      - name: Lintの実行
        if: ${{ steps.lint.outputs.has_hit == 'true' }}
        shell: bash
        env:
          FILTER: ${{ steps.lint.outputs.affected_args }}
          DEPS: ${{ steps.lint.outputs.deps_args }}
        run: |
          mapfile -t args < <(node -e 'JSON.parse(process.env.FILTER).forEach(arg => console.log(arg))')
          mapfile -t deps < <(node -e 'JSON.parse(process.env.DEPS).forEach(arg => console.log(arg))')
          HUSKY=0 pnpm install --frozen-lockfile --prefer-offline "${deps[@]}"
          pnpm exec turbo run lint --only "${args[@]}"
      - name: デプロイアーティファクトのビルド
        id: build
        if: ${{ steps.filter.outputs.has_hit == 'true' }}
        shell: bash
        env:
          DEPLOY_CHANNEL: preview
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          FILTER: ${{ steps.filter.outputs.deps_args }}
        run: |
          mapfile -t args < <(node -e 'JSON.parse(process.env.FILTER).forEach(arg => console.log(arg))')
          pnpm sync "${args[@]}"
          pnpm exec turbo run build "${args[@]}"
      - name: デプロイ前のPR状態再確認
        id: final-state
        if: ${{ steps.state.outputs.operation == 'deploy' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw Error('Invalid PR number');
            if (!/^[0-9a-f]{40}$/.test(process.env.HEAD_SHA)) throw Error('Invalid head SHA');
            const { data: pr } = await github.rest.pulls.get({...context.repo, pull_number: number});
            const operation = pr.state === 'closed' ? 'cleanup'
              : pr.head.repo?.full_name === process.env.GITHUB_REPOSITORY && pr.head.sha === process.env.HEAD_SHA && pr.base.sha === process.env.BASE_SHA ? 'deploy' : 'skip';
            core.setOutput('operation', operation);
            core.info(`PR #${number}: ${operation}`);
      - name: 準備中にクローズされたPRのクリーンアップ
        if: ${{ steps.final-state.outputs.operation == 'cleanup' }}
        uses: ./.github/actions/preview-cleanup
        with:
          pr_number: ${{ inputs.pr_number }}
      - name: 選択パッケージのデプロイ
        id: deploy
        if: ${{ steps.filter.outputs.has_hit == 'true' && steps.final-state.outputs.operation == 'deploy' }}
        uses: actions/github-script@v7
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          DEPLOY_CHANNEL: preview
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const targets = JSON.parse(process.env.TARGETS);
            const results = [];
            for (const target of targets) {
              const result = spawnSync('pnpm', ['exec', 'turbo', 'run', 'deploy', '--only', `--filter=${target.package}`], {encoding:'utf8', maxBuffer: 16 * 1024 * 1024});
              process.stdout.write(result.stdout || '');
              process.stderr.write(result.stderr || '');
              if (result.error) core.error(result.error.message);
              const success = result.status === 0 && !result.error;
              const urlMatches = success ? Array.from(new Set((result.stdout || '').match(/https:\/\/[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?(?:\/[^\s"']*)?/gi) || [])) : [];
              results.push({package:target.package, success, urls: urlMatches, url: urlMatches[0]});
            }
            core.setOutput('results', JSON.stringify(results));
            if (results.some(result => !result.success)) core.setFailed('One or more deployments failed');
      - name: 結果のサマリー作成
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
          RESULTS: ${{ steps.deploy.outputs.results || '[]' }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEPLOY_CHANNEL: preview
        with:
          script: |
            const steps = JSON.parse(process.env.STEPS);
            const results = JSON.parse(process.env.RESULTS || '[]');
            const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const rows = results.map(r => {
              const urlList = Array.isArray(r.urls) && r.urls.length > 0 ? r.urls.join('<br>') : (r.url || '');
              return `| ${r.package} | ${r.success ? 'success' : 'failure'} | ${urlList} |`;
            });
            const failures = Object.entries(steps).filter(([, s]) => s.outcome === 'failure').map(([name]) => name);
            const operation = steps['final-state']?.outputs?.operation || steps.state?.outputs?.operation;
            const detail = operation && operation !== 'deploy' ? `PR operation: ${operation}.` : results.length ? '' : 'No packages deployed.';
            const body = [`### ${process.env.DEPLOY_CHANNEL || 'preview cleanup'}: ${process.env.JOB_STATUS}`,
              detail, `Commit: ${process.env.HEAD_SHA || 'default branch'}`, `[Actions run](${url})`,
              failures.length ? `Failed steps: ${failures.join(', ')}` : '',
              '| Package | Result | URL |', '| --- | --- | --- |', ...rows].filter(Boolean).join('\n');
            await core.summary.addRaw(body).write();
            if (process.env.PR_NUMBER) {
              try {
                await github.rest.issues.createComment({...context.repo, issue_number:Number(process.env.PR_NUMBER), body});
              } catch (error) { core.warning(`Unable to notify PR: ${error.message}`); }
            }
