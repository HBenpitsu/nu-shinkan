name: UI test Report

on:
  workflow_call:
    inputs:
      pr_number:
        description: Target PR
        required: true
        type: string
      head_sha:
        description: Fixed target SHA
        required: true
        type: string

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download UI test report artifact
        uses: actions/download-artifact@v4
        with:
          name: ui_test-reports
          path: ui_test-reports
        continue-on-error: true

      - name: Build comment body
        id: build
        env:
          SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail

          short_sha="${SHA:0:7}"
          {
            echo "comment_body<<EOF"
            echo "<!-- ui_test-report -->"
            echo "## Playwright UI test Report"
            echo "Commit: ${short_sha}"
            echo "Reports are available in [this workflow run's Artifacts section](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ steps.build.outputs.comment_body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY ?? '';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) throw Error("Invalid PR number");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' &&
              typeof c.body === 'string' &&
              c.body.includes('<!-- ui_test-report -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
