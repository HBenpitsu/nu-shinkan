name: Affected Detection

on:
  workflow_call:
    inputs:
      base_sha:
        description: Base commit SHA to diff from.
        required: true
        type: string
      cache_channel:
        description: |
          value to differentiate the cache key variants.
          typically it is a tag name "release" or "staging".
        required: true
        type: string
    outputs:
      affected_apps:
        description: JSON matrix payload for affected apps.
        value: ${{ jobs.find_affected.outputs.affected_apps }}
      apps_affected:
        description: Whether app packages are affected.
        value: ${{ jobs.find_affected.outputs.apps_affected }}
      apps_filter_args:
        description: Turbo filter arguments for affected app packages.
        value: ${{ jobs.find_affected.outputs.apps_filter_args }}
      affected_scripts:
        description: JSON matrix payload for affected scripts.
        value: ${{ jobs.find_affected.outputs.affected_scripts }}
      scripts_affected:
        description: Whether script packages are affected.
        value: ${{ jobs.find_affected.outputs.scripts_affected }}
      scripts_filter_args:
        description: Turbo filter arguments for affected script packages.
        value: ${{ jobs.find_affected.outputs.scripts_filter_args }}
      all_affected:
        description: Combined affected entries from apps and scripts.
        value: ${{ jobs.find_affected.outputs.all_affected }}
      affected:
        description: Whether any app or script is affected.
        value: ${{ jobs.find_affected.outputs.affected }}
      affected_filter_args:
        description: Turbo filter arguments for all affected entries.
        value: ${{ jobs.find_affected.outputs.affected_filter_args }}

jobs:
  find_affected:
    name: Find affected apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      affected_apps: ${{ steps.detection.outputs.affected_apps }}
      apps_affected: ${{ steps.detection.outputs.apps_affected }}
      apps_filter_args: ${{ steps.detection.outputs.apps_filter_args }}
      affected_scripts: ${{ steps.detection.outputs.affected_scripts }}
      scripts_affected: ${{ steps.detection.outputs.scripts_affected }}
      scripts_filter_args: ${{ steps.detection.outputs.scripts_filter_args }}
      all_affected: ${{ steps.detection.outputs.all_affected }}
      affected: ${{ steps.detection.outputs.affected }}
      affected_filter_args: ${{ steps.detection.outputs.affected_filter_args }}
    steps:
      - name: Deep checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Common Setup
        uses: ./.github/actions/setup
        with:
          cache_channel: ${{ inputs.cache_channel }}
          turbo_cache: 'readonly'

      - name: Detect affected apps
        id: detection
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: pnpm tsx ./.github/scripts/detect-affected.ts  >> "$GITHUB_OUTPUT"

      - name: Print affected matrix
        uses: actions/github-script@v7
        with:
          script: |
            const raw = ${{ toJSON(steps.detection.outputs.affected_apps) }};
            core.info(JSON.stringify(JSON.parse(raw), null, 2));
