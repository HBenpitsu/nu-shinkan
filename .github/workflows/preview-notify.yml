name: Retry preview notification
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original workflow run containing deploy-result
        required: true
        type: string
      pr_number:
        description: PR associated with the original run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate originating run
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            if (!/^[1-9]\d*$/.test(process.env.RUN_ID)) throw Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.RUN_ID)});
            const allowed = ['.github/workflows/on-pr.yml', '.github/workflows/on-pr-close.yml', '.github/workflows/on-preview-comment.yml'];
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` || !allowed.includes(run.path)) throw Error('Unrelated workflow run');
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: deploy-result
          path: .artifacts/deploy/
      - name: Verify PR and send stored result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ inputs.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/deploy/retry-notify.mjs
