name: Retag Staging By Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Branch whose latest commit will become staging.
        required: true
        default: main
        type: string

concurrency:
  group: retag-staging
  cancel-in-progress: false

jobs:
  retag:
    name: Move staging to branch head
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate GitHub App credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.RETAG_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_ID}" ]]; then
            echo "Missing required secret: APP_ID" >&2
            exit 1
          fi

          if [[ -z "${APP_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: APP_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RETAG_APP_ID }}
          private-key: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Move staging tag to branch head
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch not found on origin: ${BRANCH_NAME}" >&2
            exit 1
          fi

          git fetch origin "${BRANCH_NAME}"
          TARGET_SHA="$(git rev-parse "FETCH_HEAD^{commit}")"

          git tag -f staging "${TARGET_SHA}"
          git push origin refs/tags/staging --force

          {
            echo "## Retag result"
            echo "- Tag: staging"
            echo "- Source branch: ${BRANCH_NAME}"
            echo "- New commit: ${TARGET_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

