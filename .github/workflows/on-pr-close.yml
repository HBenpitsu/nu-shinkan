name: On Pull Request Closed
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR whose preview resources should be deleted
        required: true
        type: string
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  queue: single
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: preview
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_KIND: ${{ github.event_name == 'workflow_dispatch' && 'delete' || 'close' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: state
        run: node .github/scripts/pr-state.mjs
      - name: Cleanup
        if: ${{ steps.state.outputs.operation == 'cleanup' }}
        uses: ./.github/actions/preview-prune
        with:
          pr_number: ${{ env.PR_NUMBER }}
      - name: Summarize and notify
        if: ${{ always() }}
        env:
          DEPLOY_CHANNEL: preview
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
        run: node .github/actions/deploy-notify/notify.mjs
