name: Clean preview
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR whose preview resources should be deleted
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/review.clean-preview.yml
    secrets: inherit
    with:
      pr_number: ${{ fromJSON(inputs.pr_number || format('{0}', github.event.pull_request.number)) }}
      manual: ${{ github.event_name == 'workflow_dispatch' }}
