name: On PR Close

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  clean-preview-workers:
    name: Delete preview workers on PR close
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Common Setup
        uses: ./.github/actions/setup
        with:
          checkout: 'shallow'
          deploy_channel: ${{ github.ref_name }}
          turbo_cache: 'update'

      - name: Delete preview workers
        run: echo 'to be implemented'