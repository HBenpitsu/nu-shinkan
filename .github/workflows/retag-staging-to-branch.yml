name: stagingタグをブランチの先頭に再設定

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 最新コミットをstagingにする対象ブランチ
        required: true
        default: main
        type: string

concurrency:
  group: retag-staging
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ワークフローアクションのチェックアウト
        uses: actions/checkout@v4
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      
      - id: use-app
        uses: ./.github/actions/use-app

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.use-app.outputs.TOKEN }}

      - name: stagingタグの再設定
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch not found on origin: ${BRANCH_NAME}" >&2
            exit 1
          fi

          git fetch origin "${BRANCH_NAME}"
          TARGET_SHA="$(git rev-parse "FETCH_HEAD^{commit}")"

          git tag -f staging "${TARGET_SHA}"
          git push origin refs/tags/staging --force

          {
            echo "## Retag result"
            echo "- Tag: staging"
            echo "- Source branch: ${BRANCH_NAME}"
            echo "- New commit: ${TARGET_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

