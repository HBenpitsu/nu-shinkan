name: Retag Release From Staging

on:
  workflow_dispatch:

concurrency:
  group: retag-release
  cancel-in-progress: false

jobs:
  retag:
    name: Move release to staging commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate GitHub App credentials
        shell: bash
        env:
          RETAG_APP_ID: ${{ secrets.RETAG_APP_ID }}
          RETAG_APP_PRIVATE_KEY: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${RETAG_APP_ID}" ]]; then
            echo "Missing required secret: RETAG_APP_ID" >&2
            exit 1
          fi

          if [[ -z "${RETAG_APP_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: RETAG_APP_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RETAG_APP_ID }}
          private-key: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Move release tag to staging commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git show-ref --verify --quiet refs/tags/staging; then
            echo "Tag not found: staging" >&2
            exit 1
          fi

          TARGET_SHA="$(git rev-parse "refs/tags/staging^{commit}")"

          git tag -f release "${TARGET_SHA}"
          git push origin refs/tags/release --force

          {
            echo "## Retag result"
            echo "- Tag: release"
            echo "- Source tag: staging"
            echo "- New commit: ${TARGET_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
