name: Retag By Commit SHA

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to move.
        required: true
        type: choice
        options:
          - staging
          - release
        default: staging
      commit_sha:
        description: Full or short commit SHA to retag.
        required: true
        type: string

concurrency:
  group: retag-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  retag:
    name: Move tag to commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      
      - name: Use GitHub App
        uses: ./.github/actions/use-app
        with:
          APP_ID: ${{ secrets.RETAG_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RETAG_APP_PRIVATE_KEY }}

      - name: Move tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "Commit not found: ${TARGET_SHA}" >&2
            exit 1
          fi

          RESOLVED_SHA="$(git rev-parse "${TARGET_SHA}^{commit}")"

          git tag -f "${TAG_NAME}" "${RESOLVED_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

          {
            echo "## Retag result"
            echo "- Tag: ${TAG_NAME}"
            echo "- New commit: ${RESOLVED_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
