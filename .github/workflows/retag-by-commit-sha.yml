name: コミットSHAによるタグ再設定

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 移動する対象タグ
        required: true
        type: choice
        options:
          - staging
          - release
        default: staging
      commit_sha:
        description: 再設定先のコミットSHA（フルまたはショート）
        required: true
        type: string

concurrency:
  group: retag-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ワークフローアクションのチェックアウト
        uses: actions/checkout@v6.1.0
        with:
          sparse-checkout: /.github/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      
      - id: use-app
        uses: ./.github/actions/use-app
        with:
          app_id: ${{ secrets.GIT_OPS_APP_ID }}
          app_private_key: ${{ secrets.GIT_OPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6.1.0
        with:
          token: ${{ steps.use-app.outputs.TOKEN }}

      - name: タグの移動
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "Commit not found: ${TARGET_SHA}" >&2
            exit 1
          fi

          RESOLVED_SHA="$(git rev-parse "${TARGET_SHA}^{commit}")"

          git tag -f "${TAG_NAME}" "${RESOLVED_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

          {
            echo "## Retag result"
            echo "- Tag: ${TAG_NAME}"
            echo "- New commit: ${RESOLVED_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
