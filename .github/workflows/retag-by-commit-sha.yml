name: Retag By Commit SHA

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to move.
        required: true
        type: choice
        options:
          - staging
          - release
      commit_sha:
        description: Full or short commit SHA to retag.
        required: true
        type: string

concurrency:
  group: retag-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  retag:
    name: Move tag to commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate GitHub App credentials
        shell: bash
        env:
          RETAG_APP_ID: ${{ secrets.RETAG_APP_ID }}
          RETAG_APP_PRIVATE_KEY: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${RETAG_APP_ID}" ]]; then
            echo "Missing required secret: RETAG_APP_ID" >&2
            exit 1
          fi

          if [[ -z "${RETAG_APP_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: RETAG_APP_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RETAG_APP_ID }}
          private-key: ${{ secrets.RETAG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Move tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "Commit not found: ${TARGET_SHA}" >&2
            exit 1
          fi

          RESOLVED_SHA="$(git rev-parse "${TARGET_SHA}^{commit}")"

          git tag -f "${TAG_NAME}" "${RESOLVED_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

          {
            echo "## Retag result"
            echo "- Tag: ${TAG_NAME}"
            echo "- New commit: ${RESOLVED_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
