name: Nightly checks
on:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/use-repo
      - name: Check workflow tooling types
        run: pnpm --filter @repo/scripts exec tsc --noEmit
      - name: Unit tests
        uses: ./.github/actions/vi-test
      - name: UI tests
        uses: ./.github/actions/ui-test
