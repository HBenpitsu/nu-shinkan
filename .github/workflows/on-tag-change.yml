name: Deploy Release By Tag

on:
  push:
    tags:
      - release
      - staging

jobs:
  detect:
    uses: ./.github/reusables/affected-detection.yml
    with:
      base_sha: ${{ github.event.before }}
      deploy_channel: ${{ github.ref_name }}
  heavy-tests:
    needs: detect
    uses: ./.github/reusables/heavy-tests.yml
    with:
      affected: ${{ needs.detect.outputs.apps_affected }}
      affected_filter_args: ${{ needs.detect.outputs.apps_filter_args }}
  light-tests:
    needs: detect
    uses: ./.github/reusables/light-tests.yml
    with:
      affected: ${{ needs.detect.outputs.apps_affected }}
      affected_filter_args: ${{ needs.detect.outputs.apps_filter_args }}
  tests:
    needs: 
      - heavy-tests
      - light-tests
  deploy:
    needs: 
      - tests
      - detect
    name: Deploy affected apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup
        uses: ./.github/actions/setup
        with:
          checkout: 'shallow'
          deploy_channel: ${{ github.ref_name }}
          turbo_cache: 'update'

      - name: Deploy affected apps
        shell: bash
        env:
          FILTERS: ${{ needs.detect.outputs.apps_filter_args }}
        run: pnpm deploy:${{ github.ref_name }} --concurrency=2 ${{ FILTERS }}