name: Deploy channel
on:
  push:
    tags: [staging, release]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to deploy in full
        type: choice
        options: [staging, release]
        required: true
permissions:
  contents: read
jobs:
  receive:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      head: ${{ steps.request.outputs.head }}
      base: ${{ steps.request.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: request
        uses: ./.github/actions/resolve-tag-revision
        with:
          event_name: ${{ github.event_name }}
          channel: ${{ inputs.channel || github.ref_name }}
          before: ${{ github.event.before }}
          after: ${{ github.event.after }}
          created: ${{ github.event.created }}
  deploy:
    needs: receive
    uses: ./.github/workflows/update.update-deploy.yml
    secrets: inherit
    with:
      channel: ${{ needs.receive.outputs.channel }}
      head_sha: ${{ needs.receive.outputs.head }}
      base_sha: ${{ needs.receive.outputs.base }}
