name: Deploy channel
on:
  push:
    tags: [staging, release]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to deploy in full
        type: choice
        options: [staging, release]
        required: true
permissions:
  contents: read
jobs:
  receive:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      head: ${{ steps.request.outputs.head }}
      base: ${{ steps.request.outputs.base }}
      source: ${{ steps.request.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: request
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ inputs.channel || github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const {EVENT,CHANNEL,BEFORE,AFTER,CREATED}=process.env;
          if(!['staging','release'].includes(CHANNEL))throw Error('Invalid channel');
          const ref=EVENT==='workflow_dispatch'?`refs/tags/${CHANNEL}`:AFTER;
          const head=execFileSync('git',['rev-parse','--verify',`${ref}^{commit}`],{encoding:'utf8'}).trim();
          const source=EVENT==='workflow_dispatch'||CREATED==='true'?'full':'diff';
          appendFileSync(process.env.GITHUB_OUTPUT,`channel=${CHANNEL}\nhead=${head}\nbase=${BEFORE??''}\nsource=${source}\n`);
          JS
  deploy:
    needs: receive
    runs-on: ubuntu-latest
    environment: ${{ needs.receive.outputs.channel }}
    concurrency:
      group: deploy-channel-${{ needs.receive.outputs.channel }}
      queue: max
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.receive.outputs.head }}
          fetch-depth: ${{ needs.receive.outputs.source == 'diff' && '0' || '1' }}
      - id: full
        if: ${{ needs.receive.outputs.source == 'full' }}
        uses: ./.github/actions/full-deploy
        with:
          channel: ${{ needs.receive.outputs.channel }}
      - id: update
        if: ${{ needs.receive.outputs.source == 'diff' }}
        uses: ./.github/actions/update-deploy
        with:
          channel: ${{ needs.receive.outputs.channel }}
          head_sha: ${{ needs.receive.outputs.head }}
          base_sha: ${{ needs.receive.outputs.base }}
      - name: Summarize
        if: ${{ always() }}
        env:
          DEPLOY_CHANNEL: ${{ needs.receive.outputs.channel }}
          HEAD_SHA: ${{ needs.receive.outputs.head }}
          JOB_STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
          RESULTS: ${{ steps.full.outputs.results || steps.update.outputs.results || '[]' }}
        run: node .github/actions/deploy-notify/notify.mjs
