name: E2E Report

on:
  workflow_call:

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Download E2E report artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: e2e-reports
        continue-on-error: true

      - name: Build comment body
        id: build
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${SHA:0:7}"
          {
            echo "comment_body<<EOF"
            echo "<!-- e2e-report -->"
            echo "## Playwright E2E Report"
            echo "Commit: ${short_sha}"
            echo "Reports are available in [this workflow run's Artifacts section](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.build.outputs.comment_body }}
        with:
          script: |
            const body = process.env.COMMENT_BODY ?? '';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' &&
              typeof c.body === 'string' &&
              c.body.includes('<!-- e2e-report -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }